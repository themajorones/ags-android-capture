name: Build capture bridge

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake git meson ninja-build pkg-config libavformat-dev libavcodec-dev libavutil-dev libswresample-dev unzip curl
      - name: Build SDL3
        run: |
          mkdir "$RUNNER_TEMP/SDL"
          git -C "$RUNNER_TEMP/SDL" init
          git -C "$RUNNER_TEMP/SDL" remote add origin https://github.com/libsdl-org/SDL.git
          git -C "$RUNNER_TEMP/SDL" fetch --depth 1 origin 535d80badefc83c5c527ec5748f2a20d6a9310fe
          git -C "$RUNNER_TEMP/SDL" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/SDL" rev-parse HEAD)" = 535d80badefc83c5c527ec5748f2a20d6a9310fe
          cmake -S "$RUNNER_TEMP/SDL" -B "$RUNNER_TEMP/SDL-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DSDL_UNIX_CONSOLE_BUILD=ON
          cmake --build "$RUNNER_TEMP/SDL-build" --parallel
          sudo cmake --install "$RUNNER_TEMP/SDL-build"
          sudo ldconfig
      - name: Build Linux bundle
        run: ./scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ags-android-capture-linux-x86_64
          path: dist/linux-x86_64/

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y adb cmake git meson ninja-build pkg-config libavformat-dev libavcodec-dev libavutil-dev libswresample-dev unzip curl
      - name: Build SDL3
        run: |
          mkdir "$RUNNER_TEMP/SDL"
          git -C "$RUNNER_TEMP/SDL" init
          git -C "$RUNNER_TEMP/SDL" remote add origin https://github.com/libsdl-org/SDL.git
          git -C "$RUNNER_TEMP/SDL" fetch --depth 1 origin 535d80badefc83c5c527ec5748f2a20d6a9310fe
          git -C "$RUNNER_TEMP/SDL" checkout --detach FETCH_HEAD
          cmake -S "$RUNNER_TEMP/SDL" -B "$RUNNER_TEMP/SDL-build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_UNIX_CONSOLE_BUILD=ON
          cmake --build "$RUNNER_TEMP/SDL-build" --parallel
          sudo cmake --install "$RUNNER_TEMP/SDL-build"
          sudo ldconfig
      - name: Build Linux ARM64 bundle
        run: ./scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ags-android-capture-linux-arm64
          path: dist/linux-arm64/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            git
            curl
            unzip
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-ffmpeg
      - name: Build Windows bundle
        shell: msys2 {0}
        run: ./scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ags-android-capture-windows-x86_64
          path: dist/windows-x86_64/
