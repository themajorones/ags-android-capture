name: Build capture bridge

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libavformat-dev libavcodec-dev libavutil-dev libswresample-dev libsdl3-dev unzip curl
      - name: Build Linux bundle
        run: ./scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ags-android-capture-linux-x86_64
          path: dist/linux-x86_64/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            curl
            unzip
            meson
            ninja
            pkgconf
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-libusb
      - name: Build Windows bundle
        shell: msys2 {0}
        run: ./scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ags-android-capture-windows-x86_64
          path: dist/windows-x86_64/
